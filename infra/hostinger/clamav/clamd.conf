# clamd for StreamX weekly-report uploads (service "clamav" in
# docker-compose.hostinger.yml). Mounted read-only over the image's
# /etc/clamav/clamd.conf, so this is the COMPLETE configuration.
#
# The backend streams every report, reference and feedback file here with
# INSTREAM over TCP 3310 on the internal "avnet" network (no published port)
# and refuses the upload on anything but "stream: OK" (fail closed).
# Limits are sized from the report rules (apps/reports, config/upload_validators.py):
#   one file <= 200 MB (REPORTS_MAX_FILE_SIZE_MB_CAP), zip vault <= 2000 entries
#   and <= 500 MB unpacked, Office containers <= 20000 entries.

# --- what the image's /init relies on (keep) -------------------------------
LocalSocket /tmp/clamd.sock
PidFile /tmp/clamd.pid
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

# --- logging (inside the container; rotated) -------------------------------
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 5M
LogRotate yes
LogTime yes
LogClean no
ExtendedDetectionInfo yes

# --- connections ------------------------------------------------------------
MaxThreads 4
MaxConnectionQueueLength 30
MaxQueue 60
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 30
SelfCheck 3600
# One signature engine in memory: during a signature reload scans wait a few
# seconds instead of a second engine doubling RAM (~1.3 GB each).
ConcurrentDatabaseReload no

# --- size limits ------------------------------------------------------------
# Larger than CLAMD_STREAM_MAX_BYTES (210 MiB, backend) > 200 MB report cap.
StreamMaxLength 220M
MaxScanSize 1000M
MaxFileSize 520M
MaxRecursion 17
MaxFiles 20000
# Below the backend's 120 s CLAMD_TIMEOUT_SECONDS so a verdict always arrives.
MaxScanTime 100000
# Anything that hits a limit above is reported (Heuristics.Limits.Exceeded.*)
# instead of silently passing as clean; the backend rejects such a file as
# "too large or complex to check".
AlertExceedsMax yes

# --- what to look inside ------------------------------------------------------
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanMail yes
ScanPE yes
ScanELF yes
Bytecode yes
HeuristicAlerts yes
# Encrypted archives / undecryptable documents cannot be inspected: block them.
AlertEncrypted yes
# Office files with VBA macros are blocked (the validators reject them too).
AlertOLE2Macros yes
