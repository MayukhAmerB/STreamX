# freshclam for the StreamX "clamav" service. Mounted read-only over the
# image's /etc/clamav/freshclam.conf (COMPLETE configuration). The image's
# /init runs it as a daemon; FRESHCLAM_CHECKS (compose) sets checks per day.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
Bytecode yes
UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 2M
LogRotate yes
LogTime yes
PidFile /tmp/freshclam.pid
ConnectTimeout 60
ReceiveTimeout 600
# Tell clamd to reload the new signatures.
NotifyClamd /etc/clamav/clamd.conf
# Downloads are still verified against ClamAV's digital signature; skipping
# the extra trial load keeps peak memory at one signature engine (~1.3 GB)
# inside the 3 GB container limit.
TestDatabases no
