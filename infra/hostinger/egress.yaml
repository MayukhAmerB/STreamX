ws_url: ws://127.0.0.1:7880

# API credentials are appended to a restricted runtime copy by
# infra/hostinger/prepare-livekit-config.sh. Never commit them here.

redis:
  address: redis:6379

template_port: 7980
health_port: 7981

# Keep costs aligned with low-CPU VPS plans so egress requests are accepted.
# For larger nodes, these can be increased.
cpu_cost:
  room_composite_cpu_cost: 1.0
  web_cpu_cost: 1.0
  track_composite_cpu_cost: 1.0
  track_cpu_cost: 0.5
