[Definition]

# Match repeated failed login and password-reset abuse on StreamX auth endpoints.
# This relies on host nginx access logs using the restored client IP.
# Only credential failures count (400/401). 429 is the API already throttling
# the client and 403 is a stale CSRF token; counting either bans whole
# classrooms behind one NAT address after a burst of legitimate retries.
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(?:POST|PUT|PATCH) /api/auth/(?:login|password-reset|password-reset-confirm)/ HTTP/\d+(?:\.\d+)?" (?:400|401) \d+ "[^"]*" "[^"]*"$
            ^<HOST> \S+ \S+ \[[^\]]+\] "POST /admin/login/(?:\?[^" ]*)? HTTP/\d+(?:\.\d+)?" 200 \d+ "[^"]*" "[^"]*"$

ignoreregex =
