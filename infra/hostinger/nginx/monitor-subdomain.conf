upstream streamx_grafana_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name monitor.alsyedinitiative.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name monitor.alsyedinitiative.com;

    ssl_certificate /etc/letsencrypt/live/alsyedinitiative.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alsyedinitiative.com/privkey.pem;

    # Grafana is an administrative surface. These controls do not restrict its
    # application resources, but prevent embedding, plugin content, and indexing.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://streamx_grafana_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
