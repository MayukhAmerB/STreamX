server {
    listen 80;
    listen 443 ssl;
    server_name stream.alsyedinitiative.com;

    ssl_certificate /etc/letsencrypt/live/alsyedinitiative.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alsyedinitiative.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "frame-ancestors https://alsyedinitiative.com https://www.alsyedinitiative.com; object-src 'none'; base-uri 'self'" always;

    # Owncast chat bootstrap bridge.
    # This endpoint is served by backend but must run under stream.* origin
    # so it can set Owncast localStorage accessToken before redirecting chat UI.
    location = /api/realtime/owncast/chat-bridge/ {
        proxy_pass http://backend_app/api/realtime/owncast/chat-bridge/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Owncast video bootstrap bridge.
    # Django validates the platform user and sets a short-lived stream cookie
    # before redirecting into the Owncast video embed.
    location = /api/realtime/owncast/stream-bridge/ {
        proxy_pass http://backend_app/api/realtime/owncast/stream-bridge/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal auth endpoint used by nginx auth_request. Direct visitors never
    # see this endpoint; nginx only needs the status code.
    location = /api/realtime/owncast/stream-access/ {
        internal;
        proxy_cache owncast_stream_access_cache;
        proxy_cache_key "$http_cookie";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 204 15s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_pass http://backend_app/api/realtime/owncast/stream-access/;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /embed/video {
        return 301 /embed/video/;
    }

    location = /embed/video/ {
        auth_request /api/realtime/owncast/stream-access/;
        proxy_pass http://owncast_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600;
    }

    location ~ ^/hls/.*\.(?:ts|m4s|mp4|aac)$ {
        auth_request /api/realtime/owncast/stream-access/;
        proxy_pass http://owncast_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_cache owncast_hls_cache;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 15m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "private, no-store" always;
        add_header X-Owncast-Segment-Cache $upstream_cache_status always;
    }

    location /hls/ {
        auth_request /api/realtime/owncast/stream-access/;
        proxy_pass http://owncast_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://owncast_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600;
    }
}
