map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_app {
    server 127.0.0.1:3000;
}

upstream backend_app {
    server 127.0.0.1:8000;
}

upstream media_app {
    server 127.0.0.1:8090;
}

upstream livekit_app {
    server 127.0.0.1:7880;
}

upstream owncast_app {
    server 127.0.0.1:8080;
    keepalive 64;
}

# Successful signed stream authorization decisions are cached briefly. This
# prevents every HLS manifest/segment request from hitting Django and allows a
# previously authorized viewer to ride through a short backend restart or
# timeout without weakening the initial fail-closed authorization check.
proxy_cache_path /var/cache/nginx/owncast_stream_access
    levels=1:2
    keys_zone=owncast_stream_access_cache:10m
    max_size=64m
    inactive=60s
    use_temp_path=off;

# Owncast HLS media segments are immutable for their lifetime. Cache them at
# the edge after auth_request succeeds so concurrent viewers do not all pull
# the same bytes from the Owncast process. Playlists remain uncached below.
proxy_cache_path /var/cache/nginx/owncast_hls
    levels=1:2
    keys_zone=owncast_hls_cache:32m
    max_size=2g
    inactive=15m
    use_temp_path=off;

server {
    listen 80;
    listen 443 ssl;
    server_name alsyedinitiative.com www.alsyedinitiative.com;

    ssl_certificate /etc/letsencrypt/live/alsyedinitiative.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alsyedinitiative.com/privkey.pem;

    client_max_body_size 5120m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    location ^~ /_protected_media/ {
        internal;
        proxy_pass http://media_app/_protected_media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_request_buffering off;
    }

    # Same-origin stream bootstrap for networks that block the dedicated
    # stream hostname. Django still validates the signed viewer/session token.
    location = /live-stream-ready/ {
        return 204;
        add_header Cache-Control "no-store" always;
    }

    location = /api/realtime/owncast/stream-access/ {
        internal;
        proxy_cache owncast_stream_access_cache;
        proxy_cache_key "$http_cookie";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 204 15s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_pass http://backend_app/api/realtime/owncast/stream-access/;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/hls/.*\.(?:ts|m4s|mp4|aac)$ {
        auth_request /api/realtime/owncast/stream-access/;
        proxy_pass http://owncast_app;
        proxy_http_version 1.1;
        proxy_set_header Host stream.alsyedinitiative.com;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_cache owncast_hls_cache;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 15m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "private, no-store" always;
        add_header X-Owncast-Segment-Cache $upstream_cache_status always;
    }

    location /hls/ {
        auth_request /api/realtime/owncast/stream-access/;
        proxy_pass http://owncast_app;
        proxy_http_version 1.1;
        proxy_set_header Host stream.alsyedinitiative.com;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    location /admin/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_request_buffering off;
    }

    location ^~ /media/lecture_videos/ {
        return 404;
    }

    location ^~ /media/streams/ {
        return 404;
    }

    location /media/ {
        proxy_pass http://media_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /static/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /health/live {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
    }

    location /health/ready {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

