server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /media/ is an ALLOWLIST: only the folders below are public. Everything
    # else under MEDIA_ROOT (paid lecture videos and resources, HLS output,
    # Host Studio and OBS recordings, and any folder added later) answers 404
    # here and reaches users only through Django views that check access and
    # answer with X-Accel-Redirect to the internal /_protected_media/ location.
    # Guarded by infra/hostinger/tests/test-media-protection-config.sh (CI).
    location ^~ /media/course_thumbnails/ {
        alias /media/course_thumbnails/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ^~ /media/profile_images/ {
        alias /media/profile_images/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ^~ /media/guide_videos/ {
        alias /media/guide_videos/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # National Desk public content (FIRs, laws, audio, video, tracker files).
    location ^~ /media/national_desk/ {
        alias /media/national_desk/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Explicit denials for the known private folders (defence in depth: they
    # would 404 through the catch-all below anyway).
    location ^~ /media/lecture_videos/ {
        return 404;
    }

    location ^~ /media/lecture_resources/ {
        return 404;
    }

    location ^~ /media/streams/ {
        return 404;
    }

    location ^~ /media/realtime_recordings/ {
        return 404;
    }

    # OBS recordings waiting for the stream recorder's MKV->MP4 conversion:
    # never public (staff play them through the admin's protected view).
    location ^~ /media/class-recording-uploads/ {
        return 404;
    }

    location /media/ {
        return 404;
    }

    location ^~ /_protected_media/ {
        alias /media/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
