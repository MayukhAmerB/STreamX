# Cap Docker json-file logs per container (50 MB x 5 files) so container
# logs can never fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  worker:
    logging: *default-logging
    build:
      context: ./backend
    restart: always
    env_file:
      - ./backend/.env.hostinger.production
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    command:
      [
        "sh",
        "-c",
        "python manage.py process_async_jobs --batch-size ${ASYNC_JOBS_BATCH_SIZE:-100} --poll-seconds ${ASYNC_JOBS_WORKER_POLL_SECONDS:-1}",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
      # Weekly report files: dedicated noexec,nosuid,nodev host directories
      # (infra/hostinger/prepare-report-storage.sh); never the media volume.
      - type: bind
        source: /srv/streamx/reports
        target: /app/private_media
        bind:
          create_host_path: false
      - type: bind
        source: /srv/streamx/reports-quarantine
        target: /app/private_quarantine
        bind:
          create_host_path: false
      - recordings_data:/recordings:ro
    # Phase 2: a real liveness probe. Every worker process rewrites
    # WORKER_HEARTBEAT_FILE about every 10 s from its periodic-hook loop
    # (apps/realtime/worker_heartbeat.py); a hung or wedged worker stops
    # refreshing it and turns unhealthy after ~90 s. infra/hostinger/autoheal.sh
    # restarts containers labelled streamx.autoheal=true (with a budget).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; p = os.environ.get('WORKER_HEARTBEAT_FILE') or '/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 90 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      streamx.autoheal: "true"
    networks:
      - appnet
      - avnet

  worker-2:
    logging: *default-logging
    build:
      context: ./backend
    restart: always
    env_file:
      - ./backend/.env.hostinger.production
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-alsyed_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}@pgbouncer:5432/${POSTGRES_DB:-alsyedacademy}"
      DATABASE_CONN_MAX_AGE: "${DATABASE_CONN_MAX_AGE:-300}"
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    command:
      [
        "sh",
        "-c",
        "python manage.py process_async_jobs --batch-size ${ASYNC_JOBS_BATCH_SIZE:-100} --poll-seconds ${ASYNC_JOBS_WORKER_POLL_SECONDS:-1}",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
      # Weekly report files: dedicated noexec,nosuid,nodev host directories
      # (infra/hostinger/prepare-report-storage.sh); never the media volume.
      - type: bind
        source: /srv/streamx/reports
        target: /app/private_media
        bind:
          create_host_path: false
      - type: bind
        source: /srv/streamx/reports-quarantine
        target: /app/private_quarantine
        bind:
          create_host_path: false
      - recordings_data:/recordings:ro
    # Phase 2: a real liveness probe. Every worker process rewrites
    # WORKER_HEARTBEAT_FILE about every 10 s from its periodic-hook loop
    # (apps/realtime/worker_heartbeat.py); a hung or wedged worker stops
    # refreshing it and turns unhealthy after ~90 s. infra/hostinger/autoheal.sh
    # restarts containers labelled streamx.autoheal=true (with a budget).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; p = os.environ.get('WORKER_HEARTBEAT_FILE') or '/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 90 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      streamx.autoheal: "true"
    cpus: "${WORKER_2_CPUS:-1.0}"
    mem_limit: "${WORKER_2_MEM_LIMIT:-1.5g}"
    mem_reservation: "${WORKER_2_MEM_RESERVATION:-768m}"
    pids_limit: 512
    networks:
      - appnet
      - avnet

  # Server-side recorder for OBS classes (apps/realtime/recording/). It pulls
  # Owncast's HLS output over the Docker network with ffmpeg stream copy (no
  # re-encode, typically <5% of one core), writes MPEG-TS parts under
  # /recordings/class-recordings and finalizes them into module lectures in
  # /app/media. It is only an HLS viewer of Owncast: if it crashes, the live
  # class is unaffected. Run exactly one replica.
  stream-recorder:
    logging: *default-logging
    build:
      context: ./backend
    restart: always
    env_file:
      - ./backend/.env.hostinger.production
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      # Phase 2: liveness file rewritten every loop (run_stream_recorder.py).
      STREAM_RECORDER_HEARTBEAT_FILE: /tmp/stream-recorder-heartbeat
    command:
      [
        "python",
        "manage.py",
        "run_stream_recorder",
        "--poll-seconds",
        "${STREAM_RECORDER_POLL_SECONDS:-2}",
      ]
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
      # Weekly report files: dedicated noexec,nosuid,nodev host directories
      # (infra/hostinger/prepare-report-storage.sh); never the media volume.
      - type: bind
        source: /srv/streamx/reports
        target: /app/private_media
        bind:
          create_host_path: false
      - type: bind
        source: /srv/streamx/reports-quarantine
        target: /app/private_quarantine
        bind:
          create_host_path: false
      - recordings_data:/recordings
    # Phase 2: a real liveness probe. The recorder loop rewrites
    # STREAM_RECORDER_HEARTBEAT_FILE every poll (2 s), leader or standby, even
    # when a tick fails; a wedged loop stops refreshing it and the container
    # turns unhealthy after ~3 min. infra/hostinger/autoheal.sh restarts it
    # (with a budget); a restart mid-class only starts the next part of the
    # same take.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; p = os.environ.get('STREAM_RECORDER_HEARTBEAT_FILE') or '/tmp/stream-recorder-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 180 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      streamx.autoheal: "true"
    cpus: "${STREAM_RECORDER_CPUS:-0.5}"
    mem_limit: "${STREAM_RECORDER_MEM_LIMIT:-768m}"
    mem_reservation: "${STREAM_RECORDER_MEM_RESERVATION:-256m}"
    pids_limit: 256
    networks:
      - appnet
      - avnet
