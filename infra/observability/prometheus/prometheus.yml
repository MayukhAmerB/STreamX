global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo-rules.yml

scrape_configs:
  - job_name: streamx_backend
    metrics_path: /metrics
    # Backend containers use Django's HTTPS redirect in production. Prometheus
    # remains on the private HTTP Docker network while declaring the original
    # request scheme expected by Django, preventing a redirect to HTTPS:8000.
    scheme: http
    http_headers:
      X-Forwarded-Proto:
        values:
          - https
    static_configs:
      - targets:
          - backend:8000
        labels:
          backend_role: primary
      - targets:
          - backend-2:8000
          - backend-3:8000
          - backend-4:8000
        labels:
          backend_role: pool

  - job_name: node_exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: redis_exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: postgres_exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
