groups:
  - name: streamx-slo-recording
    interval: 30s
    rules:
      - record: streamx:sli:http_error_ratio:rate5m
        expr: sum(rate(streamx_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(streamx_http_requests_total[5m])), 0.001)
      - record: streamx:sli:http_error_ratio:rate1h
        expr: sum(rate(streamx_http_requests_total{status_code=~"5.."}[1h])) / clamp_min(sum(rate(streamx_http_requests_total[1h])), 0.001)
      - record: streamx:sli:http_error_ratio:rate6h
        expr: sum(rate(streamx_http_requests_total{status_code=~"5.."}[6h])) / clamp_min(sum(rate(streamx_http_requests_total[6h])), 0.001)
      - record: streamx:sli:http_error_ratio:rate3d
        expr: sum(rate(streamx_http_requests_total{status_code=~"5.."}[3d])) / clamp_min(sum(rate(streamx_http_requests_total[3d])), 0.001)
      - record: streamx:sli:http_availability:ratio_rate30d
        expr: 1 - (sum(rate(streamx_http_requests_total{status_code=~"5.."}[30d])) / clamp_min(sum(rate(streamx_http_requests_total[30d])), 0.001))
      - record: streamx:sli:http_latency_good:ratio_rate30d
        expr: sum(rate(streamx_http_request_latency_seconds_bucket{le="1.0"}[30d])) / clamp_min(sum(rate(streamx_http_request_latency_seconds_count[30d])), 0.001)
      - record: streamx:sli:realtime_join_success:ratio_rate30d
        expr: sum(rate(streamx_realtime_join_total{result="success"}[30d])) / clamp_min(sum(rate(streamx_realtime_join_total[30d])), 0.001)
      - record: streamx:slo:http_availability:burn_rate5m
        expr: streamx:sli:http_error_ratio:rate5m / 0.001
      - record: streamx:slo:http_availability:burn_rate1h
        expr: streamx:sli:http_error_ratio:rate1h / 0.001
      - record: streamx:slo:http_availability:burn_rate6h
        expr: streamx:sli:http_error_ratio:rate6h / 0.001
      - record: streamx:slo:http_availability:burn_rate3d
        expr: streamx:sli:http_error_ratio:rate3d / 0.001

  - name: streamx-slo-alerts
    interval: 30s
    rules:
      - alert: StreamXAvailabilityErrorBudgetFastBurn
        expr: streamx:slo:http_availability:burn_rate5m > 14.4 and streamx:slo:http_availability:burn_rate1h > 14.4
        for: 2m
        labels:
          severity: critical
          slo: api_availability
        annotations:
          summary: "StreamX API availability error budget is burning rapidly"
          description: "The 99.9% availability budget is burning above 14.4x on both 5m and 1h windows."
      - alert: StreamXAvailabilityErrorBudgetSlowBurn
        expr: streamx:slo:http_availability:burn_rate6h > 1 and streamx:slo:http_availability:burn_rate3d > 1
        for: 30m
        labels:
          severity: warning
          slo: api_availability
        annotations:
          summary: "StreamX API availability error budget is steadily burning"
          description: "The 99.9% availability budget is being consumed on both 6h and 3d windows."
      - alert: StreamXRealtimeJoinSLOBreached
        expr: streamx:sli:realtime_join_success:ratio_rate30d < 0.99
        for: 30m
        labels:
          severity: warning
          slo: realtime_join
        annotations:
          summary: "StreamX realtime join SLO is below target"
          description: "Rolling realtime join success is below the 99% objective."
