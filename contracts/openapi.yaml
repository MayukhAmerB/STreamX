components:
  schemas:
    ActionTypeEnum:
      enum:
      - audio
      - pdf
      - video
      type: string
      description: |-
        * `audio` - Audio only (play button)
        * `pdf` - PDF download + listen guide
        * `video` - Video collection + listen guide
    BroadcastEgressStatus:
      type: object
      properties:
        running:
          type: boolean
          nullable: true
          description: True while LiveKit reports the egress starting/active; null
            when it could not be verified.
        status:
          type: string
          description: LiveKit EgressStatus name, e.g. EGRESS_ACTIVE or EGRESS_FAILED.
        error:
          type: string
      required:
      - error
      - running
      - status
    ClassRecording:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session_id:
          type: integer
          readOnly: true
          nullable: true
        source:
          allOf:
          - $ref: '#/components/schemas/ClassRecordingSourceEnum'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/ClassRecordingStateEnum'
          readOnly: true
        module:
          allOf:
          - $ref: '#/components/schemas/ModuleRef'
          nullable: true
          readOnly: true
        lecture:
          allOf:
