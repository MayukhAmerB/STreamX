        * `Tripura` - Tripura
        * `Uttar Pradesh` - Uttar Pradesh
        * `Uttarakhand` - Uttarakhand
        * `West Bengal` - West Bengal
    StatusEnum:
      enum:
      - completed
      - in_progress
      - planned
      type: string
      description: |-
        * `completed` - Completed
        * `in_progress` - In Progress
        * `planned` - Planned
    StreamHeartbeatData:
      type: object
      properties:
        session:
          type: object
          additionalProperties: {}
          description: The session, in the same shape as GET /api/realtime/sessions/{id}/
            returns it.
        egress:
          allOf:
          - $ref: '#/components/schemas/BroadcastEgressStatus'
          nullable: true
          description: Null for OBS sessions and for streams that are not live.
        restarted:
          type: boolean
          description: True when this heartbeat replaced a dead egress.
      required:
      - egress
      - restarted
      - session
    StreamHeartbeatRequest:
      type: object
      properties:
        publishing:
          type: boolean
          default: false
          description: True while the Host Studio has a connected room and a published
            video track.
    StreamHeartbeatResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/StreamHeartbeatData'
          nullable: true
        errors:
          nullable: true
      required:
      - data
      - errors
      - message
      - success
    TrackerOverview:
      type: object
      properties:
        section_label:
          type: string
          maxLength: 60
        title:
          type: string
          maxLength: 120
        subtitle:
          type: string
          maxLength: 600
        tagline:
          type: string
          maxLength: 120
        hero_image_url:
          type: string
          readOnly: true
        stats:
          type: object
          additionalProperties: {}
          readOnly: true
        updates_cta_kicker:
          type: string
          maxLength: 120
        updates_cta_body:
          type: string
          maxLength: 400
        full_tracker_url:
          description: Destination for the 'View Full Tracker' button.
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        updates:
          type: array
          items:
            $ref: '#/components/schemas/TrackerUpdate'
          readOnly: true
        is_active:
          type: boolean
      required:
      - hero_image_url
      - stats
      - updates
    TrackerUpdate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        city:
          type: string
          maxLength: 120
        region:
          type: string
          description: State or union territory, e.g. Uttar Pradesh.
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusEnum'
        status_display:
          type: string
          readOnly: true
        status_note:
          type: string
          description: Sub-line under the location, e.g. 'FIR Registered' or 'Under
            Process'.
          maxLength: 120
        date:
          type: string
          readOnly: true
        date_iso:
          type: string
          format: date
          readOnly: true
      required:
      - city
      - date
      - date_iso
      - id
      - region
      - status_display
    TransportEnum:
      enum:
      - auto
      - relay
      - unknown
      type: string
      description: |-
        * `auto` - auto
        * `relay` - relay
        * `unknown` - unknown
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    cookieJWT:
      type: apiKey
      in: cookie
      name: access_token
servers:
- url: /api
  description: Current origin API
