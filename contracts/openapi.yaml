      type: object
      properties:
        session:
          type: object
          additionalProperties: {}
          description: The session, in the same shape as GET /api/realtime/sessions/{id}/
            returns it.
        egress:
          allOf:
          - $ref: '#/components/schemas/BroadcastEgressStatus'
          nullable: true
          description: Null for OBS sessions and for streams that are not live.
        restarted:
          type: boolean
          description: True when this heartbeat replaced a dead egress.
        grace:
          type: boolean
          description: True while the server is holding the class through a host reconnect.
        host_grace_seconds:
          type: integer
      required:
      - egress
      - restarted
      - session
    StreamHeartbeatRequest:
      type: object
      properties:
        publishing:
          type: boolean
          default: false
          description: True while the Host Studio has a connected room and a published
            video track.
        state:
          allOf:
          - $ref: '#/components/schemas/StreamHeartbeatStateEnum'
          description: |-
            Host link state. 'reconnecting' while LiveKit rejoins: the server keeps the class live for the grace period instead of marking delivery failed. Defaults from 'publishing'.

            * `publishing` - publishing
            * `reconnecting` - reconnecting
            * `connected` - connected
    StreamHeartbeatResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/StreamHeartbeatData'
          nullable: true
        errors:
          nullable: true
      required:
      - data
      - errors
      - message
      - success
    StreamHeartbeatStateEnum:
      enum:
      - publishing
      - reconnecting
      - connected
      type: string
      description: |-
        * `publishing` - publishing
        * `reconnecting` - reconnecting
        * `connected` - connected
