components:
  schemas:
    RealtimeBroadcastPlaybackIssueRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        hls_error_type:
          type: string
          maxLength: 80
        http_status:
          type: integer
          maximum: 599
          minimum: 0
        retry_attempt:
          type: integer
          maximum: 100
          minimum: 0
      required:
      - reason
    ReasonEnum:
      enum:
      - network
      - authorization
      - upstream
      - media
      - unknown
      type: string
      description: |-
        * `network` - network
        * `authorization` - authorization
        * `upstream` - upstream
        * `media` - media
        * `unknown` - unknown
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    cookieJWT:
      type: apiKey
      in: cookie
      name: access_token
