name: streamx

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alsyedacademy}
      POSTGRES_USER: ${POSTGRES_USER:-alsyed_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alsyed_app} -d ${POSTGRES_DB:-alsyedacademy}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    restart: always
    env_file:
      - ./backend/.env.hostinger.production
    environment:
      OWNCAST_CHAT_BRIDGE_ENABLED: "${OWNCAST_CHAT_BRIDGE_ENABLED:-1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_media:/app/media
      # Weekly report files: dedicated noexec,nosuid,nodev host directories
      # (infra/hostinger/prepare-report-storage.sh); never the media volume.
      - type: bind
        source: /srv/streamx/reports
        target: /app/private_media
        bind:
          create_host_path: false
      - type: bind
        source: /srv/streamx/reports-quarantine
        target: /app/private_quarantine
        bind:
          create_host_path: false
      - recordings_data:/recordings:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request;req=urllib.request.Request('http://127.0.0.1:8000/health/live',headers={'Host':'${API_HOSTNAME:-api.alsyedinitiative.com}','X-Forwarded-Proto':'https'});resp=urllib.request.urlopen(req,timeout=3);sys.exit(0 if resp.status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - appnet
      - avnet

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_BACKEND_ORIGIN: ${VITE_BACKEND_ORIGIN:-}
        VITE_ENABLE_PAYMENTS: ${VITE_ENABLE_PAYMENTS:-0}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - appnet

  cases:
    build:
      context: ./cases
    restart: always
    environment:
      CASE_CONTROL_USERNAME: ${CASE_CONTROL_USERNAME:-admin}
      CASE_CONTROL_PASSWORD: ${CASE_CONTROL_PASSWORD:-}
    volumes:
      - cases_content:/app/content/cases
      - cases_uploads:/app/public/uploads
    ports:
      - "127.0.0.1:8091:8080"
    networks:
      - appnet

  osint-labs:
    build:
      context: ./OSINTCTF
    restart: always
    environment:
      CERTIFICATION_ANSWER_SECRET: ${CERTIFICATION_ANSWER_SECRET:-}
      # The Examination tab sends answers to the LMS API (recorded in Postgres).
      LABS_LMS_API_BASE: ${LABS_LMS_API_BASE:-https://alsyedinitiative.com/api}
    ports:
      - "127.0.0.1:8092:8080"
    networks:
      - appnet

  owlcognito-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_BACKEND_ORIGIN: ""
        VITE_ENABLE_PAYMENTS: ${VITE_ENABLE_PAYMENTS:-0}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_SITE_BRAND: owlcognito
        VITE_FORCE_SAME_ORIGIN_API: 1
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OWLCOGNITO_FRONTEND_PORT:-3002}:8080"
    networks:
      - appnet

  media:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - backend_media:/media:ro
      - ./infra/hostinger/nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  transcoder:
    build:
      context: ./backend
    restart: always
    env_file:
      - ./backend/.env.hostinger.production
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "python",
        "manage.py",
        "transcode_lecture_streams",
        "--pending",
        "--watch",
        "--poll-seconds",
        "20",
      ]
    volumes:
      - backend_media:/app/media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; import sys; cmd = Path('/proc/1/cmdline').read_text().replace('\\x00', ' '); sys.exit(0 if 'transcode_lecture_streams' in cmd else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ${LIVEKIT_RUNTIME_CONFIG_PATH:-/etc/streamx/livekit.yaml}:/etc/livekit.yaml:ro
      - ${LIVEKIT_TURN_CERT_PATH:-/etc/letsencrypt/live/alsyedinitiative.com/fullchain.pem}:/run/livekit-turn/fullchain.pem:ro
      - ${LIVEKIT_TURN_KEY_PATH:-/etc/letsencrypt/live/alsyedinitiative.com/privkey.pem}:/run/livekit-turn/privkey.pem:ro
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "7881:7881/tcp"
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"
      - "${LIVEKIT_TURN_UDP_PORT:-443}:${LIVEKIT_TURN_UDP_PORT:-443}/udp"
      - "${LIVEKIT_TURN_TLS_PORT:-5349}:${LIVEKIT_TURN_TLS_PORT:-5349}/tcp"
    expose:
      - "6789"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' </proc/1/cmdline | grep -q 'livekit-server'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

  livekit-egress:
    image: livekit/egress:v1.14.1
    restart: always
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
    network_mode: "service:livekit"
    environment:
      EGRESS_CONFIG_FILE: /out/egress.yaml
    volumes:
      - ${LIVEKIT_EGRESS_RUNTIME_CONFIG_PATH:-/etc/streamx/egress.yaml}:/out/egress.yaml:ro
      - recordings_data:/recordings
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' </proc/1/cmdline | grep -q 'egress'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  owncast:
    image: gabekangas/owncast:0.2.5
    restart: always
    command: ["-streamkey", "${OWNCAST_STREAM_KEY:?Set OWNCAST_STREAM_KEY in environment}"]
    volumes:
      - owncast_data:/app/data
    ports:
      - "${OWNCAST_HTTP_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${OWNCAST_RTMP_BIND_ADDRESS:-127.0.0.1}:1935:1935"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  # ClamAV for weekly-report uploads (apps/reports/antivirus.py). Reachable
  # only from the backend/worker containers on the internal "avnet" network;
  # "av_egress" exists only so freshclam can download signatures. No published
  # ports. Uploads fail closed while it is down or still loading; nothing else
  # depends on it, so a restart never takes the site down.
  # First boot: the image ships a signature snapshot that Docker copies into the
  # empty streamx_clamav_db volume; freshclam then updates it and clamd loads
  # it (1-3 minutes; up to ~10 minutes when a full download is needed).
  clamav:
    image: clamav/clamav:1.4.3
    restart: always
    environment:
      # freshclam checks per day (the ClamAV mirrors ask for at most hourly).
      FRESHCLAM_CHECKS: "12"
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: "1800"
    volumes:
      - clamav_db:/var/lib/clamav
      - ./infra/hostinger/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./infra/hostinger/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    # One signature engine (~1.3 GB RSS with the full database) plus freshclam,
    # scan buffers and a 220 MB stream; ConcurrentDatabaseReload/TestDatabases
    # are off in the configs so a reload never needs a second engine.
    mem_limit: "${CLAMAV_MEM_LIMIT:-3g}"
    mem_reservation: "${CLAMAV_MEM_RESERVATION:-1536m}"
    cpus: "${CLAMAV_CPUS:-2.0}"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 900s
    networks:
      - avnet
      - av_egress

volumes:
  postgres_data:
    name: streamx_postgres_data
  redis_data:
    name: streamx_redis_data
  owncast_data:
    name: streamx_owncast_data
  backend_media:
    name: streamx_backend_media
  # Weekly report files no longer use a named volume: they live in the
  # noexec host directories /srv/streamx/reports{,-quarantine} (bind mounts
  # above). A pre-existing streamx_backend_private_media volume is copied
  # there once by infra/hostinger/prepare-report-storage.sh and then left
  # untouched (never deleted automatically).
  clamav_db:
    name: streamx_clamav_db
  recordings_data:
    name: streamx_recordings_data
  cases_content:
    name: streamx_cases_content
  cases_uploads:
    name: streamx_cases_uploads

networks:
  appnet:
    driver: bridge
    name: streamx_appnet
  # Backend/workers <-> clamd only; no route to the outside world.
  avnet:
    driver: bridge
    internal: true
    name: streamx_avnet
  # Outbound only for freshclam's signature downloads.
  av_egress:
    driver: bridge
    name: streamx_av_egress
