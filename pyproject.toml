[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".venv",
  "backend/staticfiles",
  "backend/**/migrations",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/*.py" = ["F405"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
follow_imports = "skip"
files = [
  "backend/apps/payments/gateway_audit.py",
  "backend/apps/payments/idempotency.py",
  "backend/apps/payments/order_service.py",
  "backend/apps/realtime/policies",
]
