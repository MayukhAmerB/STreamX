<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo.jpeg" fetchpriority="high" />
    <meta name="theme-color" content="#050505" />
    <style>
      body.preload-active {
        overflow: hidden;
      }

      body.preload-active #root {
        opacity: 0;
        filter: none;
        transform: none;
        will-change: opacity;
      }

      body.app-ready #root {
        opacity: 1;
        filter: none;
        transform: none;
        transition: opacity 760ms cubic-bezier(0.2, 0.68, 0.2, 1);
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        opacity: 0;
        will-change: opacity;
      }

      #boot-loader.logo-ready {
        opacity: 1;
        transition: opacity 220ms ease;
      }

      #boot-loader .loader-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        z-index: 3;
      }

      #boot-loader .loader-mark {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #boot-loader .loader-mark::before {
        content: "";
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
        animation: logo-pulse 2s ease-in-out infinite;
        z-index: 1;
      }

      #boot-loader .loader-logo {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        border: 2px solid rgba(255, 255, 255, 0.12);
        position: relative;
        z-index: 2;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      }

      #boot-loader .loader-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: rgba(255, 255, 255, 0.45);
        border-right-color: rgba(255, 255, 255, 0.15);
        animation: spin 1s linear infinite;
        z-index: 3;
      }

      #boot-loader .loader-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.85);
        text-transform: uppercase;
        margin: 0;
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes logo-pulse {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.8;
        }
      }

      body.app-ready #boot-loader {
        opacity: 0;
        pointer-events: none;
        transition: opacity 600ms cubic-bezier(0.2, 0.68, 0.2, 1);
      }
    </style>
    <title>Al syed Initiative</title>
  </head>
  <body class="bg-ink preload-active notranslate" translate="no">
    <div id="boot-loader" role="status" aria-label="Loading Al syed Initiative">
      <div class="loader-content">
        <div class="loader-mark">
          <img
            src="/logo.jpeg"
            alt="Al syed Initiative logo"
            class="loader-logo"
            loading="eager"
            decoding="sync"
            fetchpriority="high"
          />
          <div class="loader-ring"></div>
        </div>
        <p class="loader-text">Al syed Initiative</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var loader = document.getElementById("boot-loader");
        if (!loader) return;
        var forceBootTimeout = window.setTimeout(function () {
          document.body.classList.add("app-ready");
          document.body.classList.remove("preload-active");
          if (loader.isConnected) {
            loader.remove();
          }
        }, 10000);
        var markReady = function () {
          loader.classList.add("logo-ready");
        };

        var logo = loader.querySelector(".loader-logo");
        if (!logo) {
          markReady();
        } else if (logo.complete && logo.naturalWidth > 0) {
          markReady();
        } else {
          logo.addEventListener("load", markReady, { once: true });
          logo.addEventListener("error", markReady, { once: true });
          window.setTimeout(markReady, 350);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
