{% if visible %}
  <section class="enterprise-section" aria-labelledby="profile-title">
    <header class="enterprise-section-header">
      <h2 class="enterprise-section-title" id="profile-title"><svg class="enterprise-icon" aria-hidden="true"><use href="#icon-meter"></use></svg>Server profile</h2>
      <p class="enterprise-admin-muted">Applies live, with no restarts and no interruption to classes in progress.</p>
    </header>
    <div class="enterprise-profile-bar">
    <form method="post" action="{% url 'admin:realtime_serverresourceprofile_switch' %}" class="enterprise-profile-bar-options">
      {% csrf_token %}
      {% for choice in choices %}
        <button
          type="submit"
          name="profile"
          value="{{ choice.value }}"
          class="enterprise-profile-option{% if choice.selected %} is-selected{% endif %}"
          aria-pressed="{% if choice.selected %}true{% else %}false{% endif %}"
          title="{{ choice.description }}"
        >
          <span class="enterprise-profile-option-label">{{ choice.label }}</span>
          <span class="enterprise-profile-option-description">{{ choice.description }}</span>
        </button>
      {% endfor %}
    </form>
    <p class="enterprise-profile-bar-status{% if agent_online and in_sync and not profile.agent_last_error %} is-ok{% else %} is-pending{% endif %}" role="status">
      {{ profile.status_label }}
      {% if profile.applied_profile %}
        &middot; Running: {{ applied_label }}
      {% endif %}
      &middot; <a href="{% url 'admin:realtime_serverresourceprofile_changelist' %}">Details</a>
    </p>
    </div>
  </section>
{% endif %}
