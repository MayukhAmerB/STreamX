<script>
/* Settings › Features enhancement (WS-F). Without this file the page still
   works: the switch is a native disclosure and every form is a normal POST. */
(function () {
  "use strict";
  var page = document.body;
  if (!page || !window.fetch || !window.FormData) return;
  var statusRegion = document.getElementById("ff-status");

  function closest(node, selector) {
    while (node && node.nodeType === 1) {
      if (node.matches(selector)) return node;
      node = node.parentElement;
    }
    return null;
  }

  function closeFlip(flip, focus) {
    if (!flip) return;
    flip.open = false;
    var card = closest(flip, "[data-ff-card]");
    if (card) card.classList.remove("is-confirming");
    if (focus) {
      var sw = flip.querySelector("[data-ff-switch]");
      if (sw) sw.focus();
    }
  }

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = String(text == null ? "" : text);
    return div.innerHTML;
  }

  function csrfToken() {
    var input = document.querySelector("input[name=csrfmiddlewaretoken]");
    return input ? input.value : "";
  }

  function showNotice(message, undo, level) {
    if (!statusRegion) return;
    var html = '<div class="ff-notice ' + (level === "error" ? "ff-notice--error" : "ff-notice--success") + '" data-ff-notice>' +
      '<svg class="ff-notice__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm-1 10.2L4.3 8.5l.9-.9L7 9.4l3.8-3.8.9.9L7 11.2Z"/></svg>' +
      '<p class="ff-notice__text">' + escapeHtml(message) + "</p>";
    if (undo) {
      html += '<form method="post" class="ff-notice__undo" data-ff-form>' +
        '<input type="hidden" name="csrfmiddlewaretoken" value="' + escapeHtml(csrfToken()) + '">' +
        '<input type="hidden" name="key" value="' + escapeHtml(undo.key) + '">' +
        '<input type="hidden" name="enabled" value="' + (undo.enabled ? "1" : "0") + '">' +
        '<input type="hidden" name="expected_version" value="' + escapeHtml(undo.version) + '">' +
        '<input type="hidden" name="undo" value="1">' +
        '<button type="submit" class="ff-link-button">Undo</button></form>';
    }
    html += "</div>";
    statusRegion.innerHTML = html;
  }

  function swapCard(key, cardHtml) {
    var current = document.querySelector('[data-ff-card="' + key + '"]');
    if (!current || !cardHtml) return null;
    var holder = document.createElement("div");
    holder.innerHTML = cardHtml.trim();
    var next = holder.firstElementChild;
    if (!next) return null;
    current.replaceWith(next);
    return next;
  }

  document.addEventListener("click", function (event) {
    var cancel = closest(event.target, "[data-ff-cancel]");
    if (cancel) {
      event.preventDefault();
      closeFlip(closest(cancel, "[data-ff-flip]"), true);
    }
  });

  document.addEventListener("toggle", function (event) {
    var flip = event.target;
    if (!flip.matches || !flip.matches("[data-ff-flip]")) return;
    var card = closest(flip, "[data-ff-card]");
    if (card) card.classList.toggle("is-confirming", flip.open);
  }, true);

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    var flip = closest(event.target, "[data-ff-flip]");
    if (flip && flip.open) {
      event.preventDefault();
      closeFlip(flip, true);
    }
  });

  document.addEventListener("submit", function (event) {
    var form = event.target;
    if (!form.matches || !form.matches("[data-ff-form]")) return;
    event.preventDefault();
    var submit = form.querySelector("button[type=submit]");
    if (submit) {
      if (submit.getAttribute("aria-busy") === "true") return;
      submit.setAttribute("aria-busy", "true");
    }
    var data = new FormData(form);
    var key = String(data.get("key") || "");
    fetch(window.location.pathname, {
      method: "POST",
      body: data,
      credentials: "same-origin",
      headers: { "X-Requested-With": "fetch", Accept: "application/json" },
    })
      .then(function (response) {
        return response.json().then(function (body) { return { status: response.status, body: body }; });
      })
      .then(function (result) {
        var body = result.body || {};
        var card = swapCard(key, body.card_html);
        if (body.ok) {
          if (card) card.classList.add("is-flipped");
          showNotice(body.message, body.undo, "success");
          var sw = card && card.querySelector("[data-ff-switch]");
          if (sw) sw.focus();
          return;
        }
        if (card) {
          var error = card.querySelector(".ff-confirm__error");
          if (error) {
            error.setAttribute("tabindex", "-1");
            error.focus();
          }
        } else {
          showNotice(body.message || "That did not work. Reload the page and try again.", null, "error");
        }
      })
      .catch(function () {
        // Network trouble or an HTML error page: fall back to the plain POST.
        if (submit) submit.removeAttribute("aria-busy");
        HTMLFormElement.prototype.submit.call(form);
      });
  });
})();
</script>
