name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Verify OpenAPI contract is current
        run: |
          python manage.py spectacular --file ../contracts/openapi.yaml --validate --fail-on-warn
          git diff --exit-code -- ../contracts/openapi.yaml
      - name: Ruff
        working-directory: ${{ github.workspace }}
        run: ruff check backend/apps/payments/gateway_audit.py backend/apps/payments/idempotency.py backend/apps/payments/order_service.py backend/apps/realtime/policies
      - name: Mypy
        working-directory: ${{ github.workspace }}
        run: mypy
      - run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify generated API client is current
        run: |
          npm run contract:generate
          git diff --exit-code -- src/api/generated/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify directly invoked deployment scripts are executable
        run: |
          test -x infra/hostinger/deploy-phases.sh
          test -x infra/hostinger/deploy-safe.sh
          test -x infra/hostinger/release-production.sh
          test -x infra/hostinger/deploy-course-v2.sh
          test -x infra/hostinger/prepare-report-storage.sh
      - name: Verify internal Prometheus scrape configuration
        run: |
          grep -A 10 'job_name: streamx_backend' infra/observability/prometheus/prometheus.yml | grep -q 'scheme: http'
          grep -A 10 'job_name: streamx_backend' infra/observability/prometheus/prometheus.yml | grep -q 'X-Forwarded-Proto'
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate operational shell scripts
        run: bash -n infra/hostinger/*.sh infra/hostinger/network/*.sh infra/hostinger/network/fail2ban/*.sh
      - name: Test backup verification
        run: bash infra/hostinger/tests/test-verify-backup.sh
      - name: Test Nginx deployment rollback
        run: bash infra/hostinger/tests/test-deploy-nginx-config.sh
      - name: Verify gateway-backed public routing
        run: bash infra/hostinger/tests/test-gateway-routing-config.sh
      - name: Verify certificate link-preview routing for crawlers
        run: bash infra/hostinger/tests/test-certificate-link-preview-config.sh
      - name: Verify monitor Nginx security headers
        run: bash infra/hostinger/tests/test-monitor-nginx-config.sh
      - name: Verify course release commit guard
        run: bash infra/hostinger/tests/test-deploy-course-v2.sh
      - name: Verify formal release backup policy
        run: bash infra/hostinger/tests/test-release-production-policy.sh
      - name: Verify shared-network-safe Fail2ban policy
        run: bash infra/hostinger/tests/test-fail2ban-nginx-policy.sh
      - name: Verify LiveKit runtime secret preparation
        run: bash infra/hostinger/tests/test-prepare-livekit-config.sh
      - name: Verify realtime hardening configuration
        run: bash infra/hostinger/tests/test-realtime-hardening-config.sh
      - name: Verify private media allowlist and Owncast admin block
        run: bash infra/hostinger/tests/test-media-protection-config.sh
      - name: Verify Docker log caps on every compose service
        run: bash infra/hostinger/tests/test-compose-log-caps.sh
      - name: Test database role timeout script
        run: bash infra/hostinger/tests/test-db-role-timeouts.sh
      - name: Verify report storage isolation and ClamAV service
        run: bash infra/hostinger/tests/test-report-storage-config.sh
      - name: Test report storage preparation and legacy volume migration
        run: bash infra/hostinger/tests/test-prepare-report-storage.sh
      - name: Test the live-class deploy guard
        run: bash infra/hostinger/tests/test-deploy-guard.sh
      - name: Test container autoheal
        run: bash infra/hostinger/tests/test-autoheal.sh

  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The shell expands the glob: `node --test <dir>` is not accepted by Node 22+.
      - run: node --test OSINTCTF/tests/*.test.js

  obs-uploader:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/obs-uploader
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
